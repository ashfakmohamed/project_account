name: Django API CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-outside-tests
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATA_PUSHER_ALLOWED_DESTINATION_HOSTS: webhook.example.com
      DATA_PUSHER_REQUEST_TIMEOUT_SECONDS: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        run: python data_pusher/manage.py makemigrations --check --dry-run

      - name: Run Django checks
        run: python data_pusher/manage.py check

      - name: Run tests
        run: python data_pusher/manage.py test
